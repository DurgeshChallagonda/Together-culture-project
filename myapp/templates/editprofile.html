{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f1e3e3; /* Light background */
            color: #212121; /* Matte black */
        }
        .header {
            background: #6b4848; /* Dark brown */
            width: 100%;
            height: 106px;
            position: absolute;
            left: 0px;
            top: 0px;
        }
        .nav-links {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 106px;
            padding-right: 40px;
        }
        .profile-container {
            background-color: #ffffff; /* White background */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            margin: 20px auto;
            max-width: 800px;
        }
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-header img {
            border-radius: 50%;
            width: 200px;
            height: 200px;
            border: 3px solid #6b48ff;
        }
        .profile-header h3 {
            font-size: 24px;
            color: #212121;
            margin: 0;
        }
        .form-container {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="header"></div>
    <div class="nav-links">
        <div class="nav-link" style="margin-left: 20px;">
            <a href="{% url 'resources' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">Resources</a>
        </div>
        <div class="nav-link" style="margin-left: 20px;">
            <a href="{% url 'membership_plans' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">Membership</a>
        </div>
        <div class="nav-link" style="margin-left: 20px;">
            <a href="{% url 'about_us.html' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">About Us</a>
        </div>
        <div class="nav-link" style="margin-left: 20px; position: relative;">
            <img src="{{ user.profile.image.url }}" class="user-pic" onclick="toggleMenu()" style="width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid #fff;">
            <div class="sub-menu-wrap" id="subMenu" style="position: absolute; top: 50px; right: 0; background-color: #fff; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); border-radius: 10px; overflow: hidden; display: none;">
                <div class="sub-menu" style="padding: 10px;">
                    <div class="user-info" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        {% if user.profile.image.url != '/media/default.jpg' %}
                            <img src="{{ user.profile.image.url }}" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #6b48ff;">
                        {% else %}
                            <img src="{% static 'img/profile.png' %}" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #6b48ff;">
                        {% endif %}
                        <h3 style="margin: 0; font-size: 14px; color: #333;">{{ user.username }}</h3>
                    </div>
                    <hr style="margin: 10px 0;">
                    <a href="{% url 'profile' %}" class="sub-menu-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #333; padding: 5px; border-radius: 5px; transition: background-color 0.3s ease;">
                        <img src="{% static 'img/view-profile.png' %}" style="width: 20px; height: 20px;">
                        <p style="margin: 0; font-size: 14px;">View Profile</p>
                    </a>
                    <a href="{% url 'edit_profile' %}" class="sub-menu-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #333; padding: 5px; border-radius: 5px; transition: background-color 0.3s ease;">
                        <img src="{% static 'img/profile.png' %}" style="width: 20px; height: 20px;">
                        <p style="margin: 0; font-size: 14px;">Edit Profile</p>
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="sub-menu-link" style="display: flex; align-items: center; gap: 10px; padding: 5px; border-radius: 5px; transition: background-color 0.3s ease;">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{% url 'member' %}">
                        <img src="{% static 'img/logout.png' %}" style="width: 20px; height: 20px;">
                        <button type="submit" style="background: none; border: none; color: #333; font-size: 14px; cursor: pointer; padding: 0;">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <img class="logo" src="{% static 'img/logo.png' %}" style="width: 158.74px; height: 106px; position: absolute; left: 0px; top: 0px; object-fit: cover;" />
    <div class="profile-container">
        <div class="profile-header">
            <img src="{{ user.profile.image.url }}" alt="Profile Picture">
            <h3>{{ user.username }}</h3>
        </div>
        <div class="form-container">
            <h2>Edit Profile</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required/>
                </div>
                <div class="form-group">
                    <label for="Firstname">First Name</label>
                    <input class="form-control" id="Firstname" name="Firstname" value="{{ user.first_name }}" required/>
                </div>
                <div class="form-group">
                    <label for="Lastname">Last Name</label>
                    <input type="text" class="form-control" id="Lastname" name="Lastname" value="{{ user.last_name }}" required/>
                </div>
                <div class="form-group">
                    <label for="Interests">Interests</label>
                    <input type="text" class="form-control" id="Interests" name="Interests" value="{{ user.interests }}" required />
                </div>
                <div class="form-group">
                    <label for="image">Profile Picture</label>
                    <input type="file" class="form-control-file" id="image" name="image"/>
                </div>
                <button class="btn btn-outline-info" type="submit">Update</button>
            </form>
        </div>
    </div>
    <script>
        function toggleMenu() {
            const subMenu = document.getElementById('subMenu');
            if (subMenu.style.display === 'none' || subMenu.style.display === '') {
                subMenu.style.display = 'block';
            } else {
                subMenu.style.display = 'none';
            }
        }

        // Close the dropdown if clicked outside
        document.addEventListener('click', function (event) {
            const subMenu = document.getElementById('subMenu');
            const userPic = document.querySelector('.user-pic');
            if (subMenu && !subMenu.contains(event.target) && !userPic.contains(event.target)) {
                subMenu.style.display = 'none';
            }
        });
    </script>
</body>
</html>
