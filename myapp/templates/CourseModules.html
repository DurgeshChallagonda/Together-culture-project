{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Modules</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Course Modules</h1>
        <form method="get" class="mb-4">
            <label for="category">Filter by Category:</label>
            <select name="category" id="category" class="form-control w-25 d-inline-block">
                <option value="">All</option>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == selected_category %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>
        <div class="row">
            {% for course in courses %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <a href="#" class="course-details" data-course-id="{{ course.id }}">
                        <img src="{{ course.image.url }}" class="card-img-top" alt="{{ course.name }}" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">{{ course.name }}</h5>
                            <p class="card-text">{{ course.description }}</p>
                        </div>
                    </a>
                    <div class="card-footer">
                        {% if user in course.joined_users.all %}
                        <button class="btn btn-secondary" disabled>Already Joined</button>
                        {% else %}
                        <form method="post" action="{% url 'join_course' course.id %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-primary">Join</button>
                        </form>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% empty %}
            <p>No courses available.</p>
            {% endfor %}
        </div>

        <!-- Course Details Modal -->
        <div class="modal fade" id="courseDetailsModal" tabindex="-1" role="dialog" aria-labelledby="courseDetailsModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="courseDetailsModalLabel">Course Details</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <h5 id="courseName"></h5>
                        <p id="courseDate"></p>
                        <p id="courseDescription"></p>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.1/dist/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script>
            $(document).ready(function () {
                $(".course-details").click(function (e) {
                    e.preventDefault();
                    const courseId = $(this).data("course-id");

                    $.ajax({
                        url: "{% url 'get_course_details' %}",
                        method: "GET",
                        data: { course_id: courseId },
                        success: function (response) {
                            $("#courseName").text(response.name);
                            $("#courseDate").text(response.date);
                            $("#courseDescription").text(response.description);
                            $("#courseDetailsModal").modal("show");
                        },
                        error: function () {
                            alert("Failed to load course details.");
                        }
                    });
                });
            });
        </script>
    </div>
</body>
</html>
