<!DOCTYPE html>
<html>
  <head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>Add Membership</title>
  </head>
  <body>
    <div class="main-container" style="padding: 20px;">
      <h1>Add Membership</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #6b4848; color: #ffffff; padding: 10px 20px; border: none; border-radius: 5px;">Save</button>
      </form>
      <a href="{% url 'admin_membershiptypes' %}" style="display: inline-block; margin-top: 10px;">Back to Membership Plans</a>
    </div>
  </body>
</html>
