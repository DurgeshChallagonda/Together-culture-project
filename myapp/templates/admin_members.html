<!DOCTYPE html>
<html>
  <head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="main-container" style="background: #f1e3e3; height: 2000px; position: absolute; overflow: hidden; width: 100%;">
      <div class="header" style="background: #6b4848; width: 100%; height: 106px; position: absolute; left: 0px; top: 0px;"></div>
      <div class="nav-links" style="display: flex; justify-content: flex-end; align-items: center; height: 106px; padding-right: 40px; position: relative; z-index: 1;">
        <div class="nav-link" style="margin-left: 20px;">
          <a href="{% url 'custom_admin_dashboard' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">Dashboard</a>
        </div>
        <div class="nav-link" style="margin-left: 20px;">
          <a href="{% url 'admin_event_control' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">Events</a>
        </div>
        <div class="nav-link" style="margin-left: 20px;">
          <a href="{% url 'admin_course_control' %}" class="link" style="color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700;">Courses </a>
        </div>
        <div class="nav-link" style="margin-left: 20px;">
          <form action="{% url 'logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="link" style="background: none; border: none; color: #ffffff; font-family: 'Inter-Bold', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;">Logout</button>
          </form>
        </div>
      </div>
      <a href="/" style="position: absolute; left: 0px; top: 0px; z-index: 2;">
        <img class="logo" style="width: 158.74px; height: 106px; object-fit: cover;" src="{% static 'img/logo.png' %}" />
      </a>
      <div style="background: #f1e3e3; height: 926px; position: relative; overflow: hidden;">
        <div style="color: #000000; text-align: left; font-family: 'Inter-Bold', sans-serif; font-size: 32px; font-weight: 700; position: absolute; left: 65px; top: 138px; width: 298px; height: 39px;">
          <img class="pngegg-1" style="width: 32px; height: 31px; object-fit: cover; margin-right: 10px;" src="{% static 'img/member.png' %}" />Members Panel
        </div>
        <div style="width: 221px; height: 83px; position: static">
          <div style="width: 221px; height: 83px; position: static">
            <div style="width: 221px; height: 83px; position: static">
              <div style="background: #d9d9d9; width: 221px; height: 83px; position: absolute; left: 65px; top: 253px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px;">
                <a href="admin/membership/" style="display: flex; align-items: center; text-decoration: none;">
                  <div style="color: #000000; text-align: left; font-family: 'Inter-Bold', sans-serif; font-size: 15px; font-weight: 700;">
                    All members
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
        <div style="width: 221px; height: 83px; position: static">
          <div style="background: #d9d9d9; width: 221px; height: 83px; position: absolute; left: 363px; top: 253px; display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px;">
            <a href="admin_control_membership.html" style="display: flex; align-items: center; text-decoration: none;">
              <div style="color: #000000; text-align: left; font-family: 'Inter-Bold', sans-serif; font-size: 15px; font-weight: 700;">
                Pending members
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
