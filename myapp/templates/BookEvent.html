<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Event</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f1e3e3; /* Light background */
            color: #212121; /* Matte black */
        }
        .navbar, .card, .btn {
            background-color: #FFFFFF; /* White */
            color: #212121; /* Matte black */
        }
        .navbar-brand, .nav-link, .card-header, .card-title, .btn {
            color: #212121 !important; /* Matte black */
        }
        .card-body {
            background-color: #FFFFFF; /* White */
        }
        .header {
            background: #6b4848; /* Dark brown */
            width: 100%;
            height: 106px;
            position: absolute;
            left: 0px;
            top: 0px;
        }
        .nav-links {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 106px;
            padding-right: 40px;
            position: relative;
            z-index: 1;
        }
        .nav-link {
            margin-left: 20px;
        }
        .nav-link a {
            color: #ffffff;
            font-family: 'Inter-Bold', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header"></div>
    <div class="nav-links">
        <div class="nav-link">
            <a href="#" class="link">Resources</a>
        </div>
        <div class="nav-link">
            <a href="#" class="link">Membership</a>
        </div>
        <div class="nav-link">
            <a href="#" class="link">About</a>
        </div>
        <div class="nav-link">
            <a href="{% url 'logout' %}" class="link">Logout</a>
        </div>
    </div>
    <img class="logo" style="width: 158.74px; height: 106px; position: absolute; left: 0px; top: 0px; object-fit: cover;" src="{% static 'images/logo.png' %}" />

    <!-- Main Content -->
    <div class="container mt-4">
        <h1>Book Event: {{ event.name }}</h1>
        <p>Please fill out the form below to book your spot for this event.</p>
        <div class="card mt-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="{% url 'member_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
